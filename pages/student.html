<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>แดชบอร์ดนักเรียน — Grow A Grade+</title>
  <meta name="description" content="ระบบติดตามการเรียนสำหรับนักเรียน"/>
  <link rel="stylesheet" href="../css/bouncebox.css"/>
  <style>
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeInUp 0.35s ease forwards; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: translateY(0);} }
    .traffic-dot.green  { background:#22C55E; }
    .traffic-dot.yellow { background:#FFB020; }
    .traffic-dot.red    { background:#EF4444; }
  </style>
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="sidebar-logo-icon" style="background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;border-radius:10px;width:38px;height:38px"><i data-lucide="graduation-cap" style="width:22px;height:22px"></i></div>
        <div><div class="sidebar-logo-name">Grow A Grade+</div><div class="sidebar-logo-sub">ระบบติดตามการเรียน</div></div>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-label">เมนูหลัก</div>
        <a href="#" class="nav-item active" data-tab="tab-overview"><i data-lucide="home"></i> ภาพรวม</a>
        <a href="#" class="nav-item" data-tab="tab-grades"><i data-lucide="bar-chart-2"></i> วิเคราะห์ผลการเรียน</a>
        <a href="#" class="nav-item" data-tab="tab-tcas"><i data-lucide="target"></i> เป้าหมาย TCAS</a>
        <a href="#" class="nav-item" data-tab="tab-planner"><i data-lucide="calendar"></i> วางแผนการเรียน</a>
        <a href="#" class="nav-item" data-tab="tab-pretest"><i data-lucide="clipboard-list"></i> ทดสอบวัดระดับ</a>
        <a href="#" class="nav-item" data-tab="tab-practice"><i data-lucide="dumbbell"></i> ห้องฝึกฝนโจทย์</a>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-section-label">ชุมชน & ข้อมูล</div>
        <a href="#" class="nav-item" data-tab="tab-board"><i data-lucide="message-square"></i> กระดานสนทนา</a>
        <a href="#" class="nav-item" data-tab="tab-houses"><i data-lucide="award"></i> ระบบบ้าน 9 บ้าน</a>
        <a href="#" class="nav-item" data-tab="tab-seniors"><i data-lucide="graduation-cap"></i> ทำเนียบรุ่นพี่</a>
        <a href="#" class="nav-item" data-tab="tab-mou"><i data-lucide="handshake"></i> MOU มหาวิทยาลัย</a>
      </div>
      <div class="sidebar-footer">
        <div class="user-pill">
          <div class="user-avatar" id="sidebarAvatar" style="background:var(--slate);color:#fff;display:flex;align-items:center;justify-content:center;border-radius:50%;width:34px;height:34px"><i data-lucide="user" style="width:18px;height:18px"></i></div>
          <div class="user-info"><div class="user-name" id="sidebarName">Student</div><div class="user-role" id="sidebarRole">นักเรียน</div></div>
          <button class="logout-btn" onclick="Auth.logout()" title="ออกจากระบบ"><i data-lucide="log-out"></i></button>
        </div>
      </div>
    </nav>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <div class="main-wrapper">
      <header class="topbar">
        <button class="icon-btn hamburger" onclick="toggleSidebar()" aria-label="เมนู"><i data-lucide="menu"></i></button>
        <div class="topbar-title">แดชบอร์ดนักเรียน</div>
        <div class="topbar-spacer"></div>
        <div class="topbar-badge" id="roleBadge">นักเรียน</div>
      </header>
      <main class="content"><div class="content-inner">
        <div id="tab-overview" class="tab-content active"></div>
        <div id="tab-grades"   class="tab-content"></div>
        <div id="tab-tcas"     class="tab-content"></div>
        <div id="tab-planner"  class="tab-content"></div>
        <div id="tab-pretest"  class="tab-content"></div>
        <div id="tab-practice" class="tab-content"></div>
        <div id="tab-chat"     class="tab-content"></div>
        <div id="tab-forum"    class="tab-content"></div>
        <div id="tab-news"     class="tab-content"></div>
        <div id="tab-uninews"  class="tab-content"></div>
        <div id="tab-seniors"  class="tab-content"></div>
        <div id="tab-mou"      class="tab-content"></div>
      </div></main>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/xml-utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/backend.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/features.js"></script>
  <script>
    const RENDERERS = {
      'tab-overview': GAG.overview, 'tab-grades': GAG.grades, 'tab-tcas': GAG.tcas,
      'tab-planner': GAG.planner, 'tab-pretest': GAG.pretest, 'tab-practice': GAG.practice,
      'tab-chat': GAG.chat, 'tab-forum': GAG.forum, 'tab-news': GAG.newsTab,
      'tab-uninews': GAG.uniNews, 'tab-seniors': GAG.seniors, 'tab-mou': GAG.mou
    };
    function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('open'); }
    function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('open'); }
    function renderTab(tabId){ const el=document.getElementById(tabId); const fn=RENDERERS[tabId]; if(el&&fn) fn(el); }

    document.addEventListener('DOMContentLoaded', async () => {
      await (window.API && API.ready);
      const user = Auth.requireAuth(['student']);
      if (!user) return;
      document.getElementById('sidebarName').textContent = user.displayName;
      document.getElementById('sidebarRole').textContent = Auth.getRoleLabel(user.role);
      document.getElementById('sidebarAvatar').innerHTML = '<i data-lucide="user" style="width:18px;height:18px"></i>';
      document.getElementById('roleBadge').textContent = Auth.getRoleLabel(user.role);

      document.querySelectorAll('.sidebar .nav-item[data-tab]').forEach(item => {
        item.addEventListener('click', e => {
          e.preventDefault();
          const tabId = item.getAttribute('data-tab');
          document.querySelectorAll('.sidebar .nav-item').forEach(n => n.classList.remove('active'));
          item.classList.add('active');
          document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
          document.getElementById(tabId).classList.add('active');
          renderTab(tabId);
          if (window.innerWidth <= 768) closeSidebar();
        });
      });

      renderTab('tab-overview');
      lucide.createIcons();
    });
  </script>
</body>
</html>
