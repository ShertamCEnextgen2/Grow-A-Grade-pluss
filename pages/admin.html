<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>แดชบอร์ดผู้ดูแลระบบ — Grow A Grade+</title>
  <link rel="stylesheet" href="../css/bouncebox.css"/>
  <style>
    .tab-content { display:none; } .tab-content.active { display:block; animation:fadeInUp .35s ease forwards; }
    @keyframes fadeInUp { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
    .traffic-dot.green{background:#22C55E;} .traffic-dot.yellow{background:#FFB020;} .traffic-dot.red{background:#EF4444;}
  </style>
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-logo"><div class="sidebar-logo-icon" style="background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;border-radius:10px;width:38px;height:38px"><i data-lucide="layers" style="width:22px;height:22px"></i></div><div><div class="sidebar-logo-name">Grow A Grade+</div><div class="sidebar-logo-sub">ผู้ดูแลระบบ</div></div></div>
      <div class="sidebar-section"><div class="sidebar-section-label">เมนู</div>
        <a href="#" class="nav-item active" data-tab="tab-analytics"><i data-lucide="pie-chart"></i> รายงานภาพรวม</a>
        <a href="#" class="nav-item" data-tab="tab-curriculum"><i data-lucide="book"></i> รายวิชาและแผนการเรียน</a>
        <a href="#" class="nav-item" data-tab="tab-users"><i data-lucide="users"></i> จัดการผู้ใช้</a>
        <a href="#" class="nav-item" data-tab="tab-roster"><i data-lucide="clipboard-list"></i> นักเรียนทุกบ้าน</a>
        <a href="#" class="nav-item" data-tab="tab-tcas"><i data-lucide="graduation-cap"></i> โครงการ TCAS</a>
        <a href="#" class="nav-item" data-tab="tab-import"><i data-lucide="upload"></i> นำเข้า CSV</a>
        <a href="#" class="nav-item" data-tab="tab-audit"><i data-lucide="scroll-text"></i> Audit Log</a>
      </div>
      <div class="sidebar-footer"><div class="user-pill"><div class="user-avatar" id="sidebarAvatar" style="background:var(--slate);color:#fff;display:flex;align-items:center;justify-content:center;border-radius:50%;width:34px;height:34px"><i data-lucide="shield" style="width:18px;height:18px"></i></div>
        <div class="user-info"><div class="user-name" id="sidebarName">Admin</div><div class="user-role" id="sidebarRole">ผู้ดูแลระบบ</div></div>
        <button class="logout-btn" onclick="Auth.logout()"><i data-lucide="log-out"></i></button></div></div>
    </nav>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
    <div class="main-wrapper">
      <header class="topbar"><button class="icon-btn hamburger" onclick="toggleSidebar()"><i data-lucide="menu"></i></button>
        <div class="topbar-title">แดชบอร์ดผู้ดูแลระบบ</div><div class="topbar-spacer"></div><div class="topbar-badge" id="roleBadge">ผู้ดูแลระบบ</div></header>
      <main class="content"><div class="content-inner">
        <!-- Image-Inspired Minimal Icon Pill Action Bar ("icon minimal") -->
        <div class="action-pill-bar">
          <button class="btn-pill btn-pill-coral" onclick="GAG.go('curriculum')"><i data-lucide="book"></i> รายวิชา</button>
          <button class="btn-pill btn-pill-coral" onclick="GAG.go('curriculum')"><i data-lucide="layout-grid"></i> แผนการเรียน</button>
          <button class="btn-pill btn-pill-dashed" onclick="GAG.go('roster')"><i data-lucide="home"></i> บ้าน</button>
          <button class="btn-pill btn-pill-slate" onclick="GAG.saveSystemXML()"><i data-lucide="file-code-2"></i> ให้เซฟไฟล์ลง XML</button>
          <button class="btn-pill btn-pill-slate" onclick="GAG.exportIndividualXMLModal()"><i data-lucide="user"></i> ข้อมูลรายบุคคล ลง xml</button>
        </div>

        <div id="tab-analytics"  class="tab-content active"></div>
        <div id="tab-curriculum" class="tab-content"></div>
        <div id="tab-users"      class="tab-content"></div>
        <div id="tab-roster"     class="tab-content"></div>
        <div id="tab-tcas"       class="tab-content"></div>
        <div id="tab-import"     class="tab-content"></div>
        <div id="tab-audit"      class="tab-content"></div>
      </div></main>
    </div>
  </div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../js/data.js"></script><script src="../js/xml-utils.js"></script>
  <script src="../js/api.js"></script><script src="../js/backend.js"></script><script src="../js/auth.js"></script><script src="../js/features.js"></script>
  <script>
    const RENDERERS = { 'tab-analytics':GAG.analytics, 'tab-curriculum':GAG.curriculumAdmin, 'tab-users':GAG.usersAdmin, 'tab-roster':GAG.rosterAll, 'tab-tcas':GAG.tcasEditor, 'tab-import':GAG.importCsv, 'tab-audit':GAG.auditLog };
    function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('open'); }
    function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('open'); }
    function renderTab(id){ const el=document.getElementById(id), fn=RENDERERS[id]; if(el&&fn) fn(el); }
    document.addEventListener('DOMContentLoaded', async () => {
      await (window.API && API.ready);
      const user = Auth.requireAuth(['admin']); if(!user) return;
      document.getElementById('sidebarName').textContent = user.displayName;
      document.getElementById('sidebarRole').textContent = Auth.getRoleLabel(user.role);
      document.getElementById('sidebarAvatar').innerHTML = '<i data-lucide="shield-check" style="width:18px;height:18px"></i>';
      document.getElementById('roleBadge').textContent = Auth.getRoleLabel(user.role);
      document.querySelectorAll('.sidebar .nav-item[data-tab]').forEach(item => item.addEventListener('click', e => {
        e.preventDefault(); const tabId=item.getAttribute('data-tab');
        document.querySelectorAll('.sidebar .nav-item').forEach(n=>n.classList.remove('active')); item.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active')); document.getElementById(tabId).classList.add('active');
        renderTab(tabId); if(window.innerWidth<=768) closeSidebar();
      }));
      renderTab('tab-analytics'); lucide.createIcons();
    });
  </script>
</body>
</html>
