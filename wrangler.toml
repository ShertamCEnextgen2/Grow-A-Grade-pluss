name = "grow-a-grade"
compatibility_date = "2024-01-01"
pages_build_output_dir = "."

# Cloudflare R2 binding for XML data storage
[[r2_buckets]]
binding = "DATA"
bucket_name = "grow-a-grade-data"

# Environment variables (set via dashboard or wrangler CLI)
# ADMIN_TOKEN = "your-secret-token-here"
# Set with: npx wrangler pages secret put ADMIN_TOKEN

[vars]
APP_NAME = "Grow A Grade+"
APP_VERSION = "2.0"
